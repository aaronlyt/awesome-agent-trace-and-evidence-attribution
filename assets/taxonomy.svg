<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
  </defs>

  <rect width="1180" height="560" fill="#ffffff"/>
  <text x="590" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2430">From Agent Traces to Trust — A Map of Agent-Trace Research</text>
  <text x="590" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Trace sources → trace representation → trace understanding → trace-governed execution → downstream trust functions</text>

  <!-- Column 1: Trace Sources -->
  <g>
    <rect x="30" y="90" width="200" height="330" rx="10" fill="#eef4ff" stroke="#b6c8ec"/>
    <text x="130" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#2b4a8b">1 · Trace Sources</text>
    <g font-size="12" fill="#33415c" text-anchor="middle">
      <rect x="45" y="135" width="170" height="34" rx="6" fill="#ffffff" stroke="#d3def3"/><text x="130" y="156">Reasoning (CoT / plans)</text>
      <rect x="45" y="177" width="170" height="34" rx="6" fill="#ffffff" stroke="#d3def3"/><text x="130" y="198">Retrieval (RAG)</text>
      <rect x="45" y="219" width="170" height="34" rx="6" fill="#ffffff" stroke="#d3def3"/><text x="130" y="240">Tool use / MCP</text>
      <rect x="45" y="261" width="170" height="34" rx="6" fill="#ffffff" stroke="#d3def3"/><text x="130" y="282">Memory (write / read)</text>
      <rect x="45" y="303" width="170" height="34" rx="6" fill="#ffffff" stroke="#d3def3"/><text x="130" y="324">Environment / actions</text>
      <rect x="45" y="345" width="170" height="34" rx="6" fill="#ffffff" stroke="#d3def3"/><text x="130" y="366">Multi-agent messages</text>
    </g>
  </g>

  <!-- Column 2: Representation -->
  <g>
    <rect x="262" y="90" width="200" height="330" rx="10" fill="#eefaf2" stroke="#b3e0c6"/>
    <text x="362" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1e6b45">2 · Representation</text>
    <g font-size="12" fill="#2c4a3c" text-anchor="middle">
      <rect x="277" y="135" width="170" height="34" rx="6" fill="#ffffff" stroke="#cde8d9"/><text x="362" y="156">Structured logs</text>
      <rect x="277" y="177" width="170" height="34" rx="6" fill="#ffffff" stroke="#cde8d9"/><text x="362" y="198">Execution graphs</text>
      <rect x="277" y="219" width="170" height="34" rx="6" fill="#ffffff" stroke="#cde8d9"/><text x="362" y="240">Evidence / claim-support</text>
      <rect x="277" y="261" width="170" height="34" rx="6" fill="#ffffff" stroke="#cde8d9"/><text x="362" y="282">Runtime provenance</text>
      <rect x="277" y="303" width="170" height="34" rx="6" fill="#ffffff" stroke="#cde8d9"/><text x="362" y="324">Standards: PROV-DM,</text>
      <text x="362" y="340" font-size="11">OTel GenAI, OpenLineage</text>
    </g>
  </g>

  <!-- Column 3: Understanding -->
  <g>
    <rect x="494" y="90" width="200" height="330" rx="10" fill="#fff6e9" stroke="#ecd3a7"/>
    <text x="594" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a13">3 · Understanding</text>
    <g font-size="12" fill="#5c4520" text-anchor="middle">
      <rect x="509" y="135" width="170" height="34" rx="6" fill="#ffffff" stroke="#f2e2c4"/><text x="594" y="156">Evidence attribution</text>
      <rect x="509" y="177" width="170" height="34" rx="6" fill="#ffffff" stroke="#f2e2c4"/><text x="594" y="198">Error / failure taxonomies</text>
      <rect x="509" y="219" width="170" height="34" rx="6" fill="#ffffff" stroke="#f2e2c4"/><text x="594" y="240">Failure attribution</text>
      <rect x="509" y="261" width="170" height="34" rx="6" fill="#ffffff" stroke="#f2e2c4"/><text x="594" y="282">Trace debugging</text>
      <rect x="509" y="303" width="170" height="34" rx="6" fill="#ffffff" stroke="#f2e2c4"/><text x="594" y="324">Faithfulness &amp; limits</text>
    </g>
  </g>

  <!-- Column 4: Governed Execution -->
  <g>
    <rect x="726" y="90" width="200" height="330" rx="10" fill="#fdeef4" stroke="#eabdd0"/>
    <text x="826" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#8f2e5c">4 · Governance</text>
    <g font-size="12" fill="#5f2c42" text-anchor="middle">
      <rect x="741" y="135" width="170" height="34" rx="6" fill="#ffffff" stroke="#f3d4e2"/><text x="826" y="156">Injection defense</text>
      <rect x="741" y="177" width="170" height="34" rx="6" fill="#ffffff" stroke="#f3d4e2"/><text x="826" y="198">Info-flow control &amp; taint</text>
      <rect x="741" y="219" width="170" height="34" rx="6" fill="#ffffff" stroke="#f3d4e2"/><text x="826" y="240">Runtime guardrails</text>
      <rect x="741" y="261" width="170" height="34" rx="6" fill="#ffffff" stroke="#f3d4e2"/><text x="826" y="282">Memory provenance</text>
      <rect x="741" y="303" width="170" height="34" rx="6" fill="#ffffff" stroke="#f3d4e2"/><text x="826" y="324">Learning from traces</text>
    </g>
  </g>

  <!-- Column 5: Trust Functions -->
  <g>
    <rect x="958" y="90" width="192" height="330" rx="10" fill="#f1eefc" stroke="#cbbdf0"/>
    <text x="1054" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3492">5 · Trust Functions</text>
    <g font-size="12" fill="#3d3163" text-anchor="middle">
      <rect x="971" y="135" width="166" height="30" rx="6" fill="#ffffff" stroke="#ddd4f4"/><text x="1054" y="154">Verification</text>
      <rect x="971" y="173" width="166" height="30" rx="6" fill="#ffffff" stroke="#ddd4f4"/><text x="1054" y="192">Attribution</text>
      <rect x="971" y="211" width="166" height="30" rx="6" fill="#ffffff" stroke="#ddd4f4"/><text x="1054" y="230">Debugging</text>
      <rect x="971" y="249" width="166" height="30" rx="6" fill="#ffffff" stroke="#ddd4f4"/><text x="1054" y="268">Safety enforcement</text>
      <rect x="971" y="287" width="166" height="30" rx="6" fill="#ffffff" stroke="#ddd4f4"/><text x="1054" y="306">Audit</text>
      <rect x="971" y="325" width="166" height="30" rx="6" fill="#ffffff" stroke="#ddd4f4"/><text x="1054" y="344">Recovery</text>
    </g>
  </g>

  <!-- Arrows -->
  <line x1="232" y1="255" x2="260" y2="255" stroke="#8a93a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="464" y1="255" x2="492" y2="255" stroke="#8a93a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="696" y1="255" x2="724" y2="255" stroke="#8a93a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="928" y1="255" x2="956" y2="255" stroke="#8a93a6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Bottom band -->
  <rect x="30" y="450" width="1120" height="70" rx="10" fill="#f7f8fa" stroke="#dfe3ea"/>
  <text x="590" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#3b4356">Typed provenance relations: SUPPORT · CONTRADICT · DEPEND-ON · DERIVE · TRIGGER · UPDATE · INVALIDATE · USE · GENERATE</text>
  <text x="590" y="501" text-anchor="middle" font-size="12" fill="#6b7280">Granularity: run / step / tool-call / parameter / claim / span  ·  Timing: pre-execution / runtime / post-hoc / continuous</text>

  <text x="590" y="545" text-anchor="middle" font-size="11" fill="#9aa1ad">Awesome Agent Trace · companion list of “From Agent Traces to Trust” (arXiv:2606.04990)</text>
</svg>
